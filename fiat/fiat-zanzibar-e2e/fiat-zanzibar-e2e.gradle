// End-to-end tests for store-backed Fiat: runs the services' installed distributions against
// SpiceDB, MySQL and Redis containers. See README.md.

dependencies {
  testImplementation project(":fiat-api")
  testImplementation project(":fiat-core")
  testImplementation "io.spinnaker.kork:kork-core"
  testImplementation "io.spinnaker.kork:kork-retrofit"
  testImplementation "io.spinnaker.kork:kork-zanzibar"
  testImplementation "com.fasterxml.jackson.core:jackson-databind"
  testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"
  testImplementation "com.netflix.spectator:spectator-api"
  testImplementation "com.squareup.okhttp3:okhttp"
  testImplementation "com.squareup.retrofit2:converter-jackson"
  testImplementation "com.squareup.retrofit2:retrofit"
  testImplementation "org.springframework.security:spring-security-core"
  testImplementation "org.assertj:assertj-core"
  testImplementation "org.junit.jupiter:junit-jupiter"
  testImplementation "org.testcontainers:testcontainers"
  testImplementation "org.testcontainers:testcontainers-mysql"
  testRuntimeOnly "com.mysql:mysql-connector-j"
  testCompileOnly "org.projectlombok:lombok"
}

test {
  dependsOn ":fiat-web:installDist"
  onlyIf("-Dzanzibar.e2e=true is set") {
    providers.systemProperty("zanzibar.e2e").getOrElse("false") == "true"
  }
  maxHeapSize = "1g"
  testLogging {
    showStandardStreams = true
  }
  // Forward -Dzanzibar.e2e.* to the forked test JVM.
  providers.systemPropertiesPrefixedBy("zanzibar.e2e").get().each { name, value ->
    systemProperty(name, value)
  }
  systemProperty "zanzibar.e2e.repoRoot", rootProject.projectDir.parentFile.absolutePath
  systemProperty "zanzibar.e2e.workDir", layout.buildDirectory.dir("zanzibar-e2e").get().asFile.absolutePath
}
